[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f7"
textColor = "#0f172a"
borderColor = "#dbe2ec"
dataframeHeaderBackgroundColor = "#e8edf5"
showWidgetBorder = true
baseRadius = "small"
buttonRadius = "small"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.6rem"
redColor = "#b91c1c"
orangeColor = "#b45309"
yellowColor = "#a16207"
greenColor = "#15803d"
blueColor = "#1d4ed8"
violetColor = "#6d28d9"

[theme.sidebar]
backgroundColor = "#e9eef6"
secondaryBackgroundColor = "#dde5f0"
textColor = "#0f172a"
borderColor = "#cfd8e5"
primaryColor = "#1e40af"

[server]
port = 8080
address = "0.0.0.0"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
