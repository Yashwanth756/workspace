services:
  api:
    build: .
    container_name: fairshare-api
    command: python run_api_service.py
    env_file:
      - .env
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./database:/app/database
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/docs', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  dashboard:
    build: .
    container_name: fairshare-dashboard
    command: streamlit run run_dashboard.py --server.address=0.0.0.0 --server.port=8080
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8081
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped